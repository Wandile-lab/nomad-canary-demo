name: Build, Push, and Canary Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA tag
        id: vars
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ github.repository }}:latest

  deploy-canary:
    needs: build-and-push
    runs-on: self-hosted
    env:
      NOMAD_ADDR: http://127.0.0.1:4646
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy canary to Nomad and wait for rollout
        run: ./deploy.sh "${{ needs.build-and-push.outputs.sha_tag }}"
